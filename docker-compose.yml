name: rocket-factory

# Общие настройки Go-сервисов, чтобы не повторять их пять раз.
x-service-defaults: &service-defaults
  env_file: .env
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  expose:
    - "8080"
    - "9090"
  # В distroless нет shell и curl, поэтому живость проверяет собственный
  # статический бинарник, собранный из cmd/healthcheck.
  healthcheck:
    test: ["CMD", "/healthcheck", "-addr=127.0.0.1:8080"]
    interval: 10s
    timeout: 3s
    retries: 6
    start_period: 20s

x-service-env: &service-env
  HTTP_ADDR: :8080
  GRPC_ADDR: :9090

services:
  postgres:
    image: postgres:16-alpine
    container_name: rocket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rocket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rocket}
      POSTGRES_DB: ${POSTGRES_DB:-rocket_factory}
    ports:
      # Слева порт на хосте, справа порт внутри сети. Приложение подключается
      # по внутреннему порту (POSTGRES_INTERNAL_PORT), поэтому смена хостового
      # порта из-за конфликта больше не ломает подключение сервисов.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rocket} -d ${POSTGRES_DB:-rocket_factory}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rocket-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # KRaft вместо ZooKeeper: на один контейнер меньше и быстрее старт.
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: rocket-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_HOST_PORT:-9094}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: rocket-factory-cluster-1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # Топики создаются явно и с несколькими партициями: автосоздание давало
  # одну партицию на топик, что скрывает работу партиционирования по order_id.
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: rocket-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for topic in order.events inventory.events payment.events production.events; do
          kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$topic" --partitions 3 --replication-factor 1
        done
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic rocket.dlq --partitions 1 --replication-factor 1
        echo "topics ready"
        kafka-topics --bootstrap-server kafka:9092 --list

  migrate:
    image: migrate/migrate:v4.17.1
    container_name: rocket-migrate
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-rocket}:${POSTGRES_PASSWORD:-rocket}@postgres:5432/${POSTGRES_DB:-rocket_factory}?sslmode=disable
      - up

  auth-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: rocket-auth-service
    environment:
      <<: *service-env
      SERVICE_NAME: auth-service

  order-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: rocket-order-service
    environment:
      <<: *service-env
      SERVICE_NAME: order-service
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  inventory-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    container_name: rocket-inventory-service
    environment:
      <<: *service-env
      SERVICE_NAME: inventory-service
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payment-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: rocket-payment-service
    environment:
      <<: *service-env
      SERVICE_NAME: payment-service
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      order-service:
        condition: service_started

  production-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/production-service/Dockerfile
    container_name: rocket-production-service
    environment:
      <<: *service-env
      SERVICE_NAME: production-service
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: rocket-nginx
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_started
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: rocket-prometheus
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d

  grafana:
    image: grafana/grafana:11.1.0
    container_name: rocket-grafana
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: rocket-jaeger
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data:
