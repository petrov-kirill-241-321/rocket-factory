events {
    worker_connections 1024;
}

http {
    # Единый формат ошибок: nginx не должен отдавать HTML там, где всё
    # остальное API отвечает JSON.
    error_page 500 502 503 504 /error-5xx.json;
    error_page 413 /error-413.json;

    log_format json_combined escape=json '{'
        '"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"upstream":"$upstream_addr",'
        '"latency":$request_time'
    '}';
    access_log /dev/stdout json_combined;

    # Защита от перебора паролей и от заваливания API запросами.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    upstream auth_service {
        server auth-service:8080;
        keepalive 16;
    }

    upstream order_service {
        server order-service:8080;
        keepalive 16;
    }

    upstream payment_service {
        server payment-service:8080;
        keepalive 16;
    }

    server {
        listen 80;
        server_tokens off;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;

        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://auth_service;
        }

        # Регулярное выражение проверяется раньше префиксных location,
        # поэтому оплата уходит в payment-service, а не в order-service.
        location ~ ^/api/orders/[^/]+/pay$ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://payment_service;
        }

        location = /api/orders {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://order_service;
        }

        location /api/orders/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://order_service;
        }

        # Метрики наружу не проксируются: /metrics доступен только внутри сети.
        location /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        location = /error-5xx.json {
            internal;
            default_type application/json;
            return 503 '{"error":{"code":"service_unavailable","message":"upstream service is unavailable"}}';
        }

        location = /error-413.json {
            internal;
            default_type application/json;
            return 413 '{"error":{"code":"payload_too_large","message":"request body is too large"}}';
        }
    }
}
